{% macro champ(label, nom, valeur, type_champ) %}
<label class="form-control w-full">
  <span class="u-lbl">{{ label }}</span>
  <input class="input input-bordered w-full" type="{{ type_champ }}" name="{{ nom }}" value="{{ valeur }}">
</label>
{% endmacro %}

{% macro liste_deroulante(label, nom, choix) %}
<label class="form-control w-full">
  <span class="u-lbl">{{ label }}</span>
  <select class="select select-bordered w-full" name="{{ nom }}">
    <option value="">—</option>
    {% for c in choix %}
    <option value="{{ c.valeur }}"{% if c.choisi %} selected{% endif %}>{{ c.libelle }}</option>
    {% endfor %}
  </select>
</label>
{% endmacro %}
