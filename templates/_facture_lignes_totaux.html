<table class="table table-sm max-w-md ml-auto">
  <tbody>
    <tr><td>Total HT</td><td class="text-right whitespace-nowrap">{{ lignes.totaux.ht }}</td></tr>
    {% for t in lignes.totaux.tva %}
    <tr class="opacity-80"><td>TVA {{ t.taux }} (sur {{ t.base }})</td><td class="text-right whitespace-nowrap">{{ t.montant }}</td></tr>
    {% endfor %}
    <tr class="font-bold"><td>Total TTC</td><td class="text-right whitespace-nowrap">{{ lignes.totaux.ttc }}</td></tr>
  </tbody>
</table>
{% if lignes.totaux.autoliquidation %}<p class="text-sm text-right">Mention sur la facture : « TVA acquittée par autoliquidation ».</p>{% endif %}
