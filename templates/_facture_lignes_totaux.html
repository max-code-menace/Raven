<div class="flex flex-col items-end gap-1 text-[13.5px]">
  <div class="flex gap-8"><span>Total HT</span><strong class="w-32 text-right whitespace-nowrap">{{ lignes.totaux.ht }}</strong></div>
  {% for t in lignes.totaux.tva %}
  <div class="flex gap-8 u-muet"><span>TVA {{ t.taux }} (sur {{ t.base }})</span><span class="w-32 text-right whitespace-nowrap">{{ t.montant }}</span></div>
  {% endfor %}
  <div class="flex gap-8 text-[15px]"><span>Total TTC</span><strong class="w-32 text-right whitespace-nowrap">{{ lignes.totaux.ttc }}</strong></div>
  {% if lignes.totaux.autoliquidation %}<p class="u-petit">Mention sur la facture : « TVA acquittée par autoliquidation ».</p>{% endif %}
</div>
