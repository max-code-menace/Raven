# Tests automatiques (mise en ligne, étape 7-1) : à chaque demande de fusion et à chaque changement de main, GitHub
# compile Raven et lance tous les tests sur une base PostgreSQL neuve. Une demande de fusion dont les tests échouent se
# voit tout de suite sur GitHub (croix rouge), avant de la fusionner.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Un utilisateur ordinaire, comme chez Mahx et en production : ni super-utilisateur, ni BYPASSRLS.
      DATABASE_URL: postgres://ubifacture:essai-ci@localhost:5432/ubifacture
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Le CSS de Tailwind (assets/web/raven.css) doit suivre les classes des gabarits : sinon une classe ajoutée
      # resterait sans effet à l'écran. On le refabrique avec le même outil (3.4.17) et on vérifie qu'il ne change pas.
      - name: CSS de Tailwind à jour (scripts/css.ps1)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/tailwindcss" https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64
          echo "7d24f7fa191d2193b78cd5f5a42a6093e14409521908529f42d80b11fde1f1d4  $RUNNER_TEMP/tailwindcss" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/tailwindcss"
          "$RUNNER_TEMP/tailwindcss" -o assets/web/raven.css --content "./templates/**/*.html,./src/**/*.rs" --minify
          git diff --exit-code assets/web/raven.css || { echo "::error::assets/web/raven.css n'est pas à jour : lancer scripts/css.ps1 et le versionner."; exit 1; }
      - name: Utilisateur et base (scripts/creer-base.sql)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -v mdp=essai-ci -f scripts/creer-base.sql
      - name: Compilation
        run: cargo build --locked
      - name: Tests
        run: cargo test --locked
