[package]
name = "ubifacture"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
askama = "0.16.1"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["form", "query", "cookie"] }
base64 = "0.22"
calamine = "0.28"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
dotenvy = "0.15.7"
getrandom = "0.3"
hex = "0.4.3"
lopdf = "0.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "chrono"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
typst = "0.15.1"
typst-kit = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
ureq = { version = "2.12", features = ["json"] }
rpassword = "7"
sha2 = "0.11.1"
time = "0.3.55"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

# Moins d'informations de débogage : la compilation (dossier target) prend beaucoup moins de place sur le disque.
# Sans effet sur le fonctionnement de l'application.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
