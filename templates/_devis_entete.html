<div class="flex flex-wrap items-center justify-between gap-2 mb-4">
  <div class="flex items-center gap-3">
    <h1 class="text-2xl font-bold">Devis N° {{ numero }}</h1>
    <span class="badge {{ classe_statut }} whitespace-nowrap">{{ statut }}</span>
  </div>
  <a class="btn btn-ghost" href="/devis">Retour à la liste</a>
</div>

<div role="tablist" class="tabs tabs-bordered mb-4">
  <a role="tab" class="tab{% if onglet == "informations" %} tab-active{% endif %}" href="/devis/{{ id }}">Informations</a>
  <a role="tab" class="tab{% if onglet == "encodage" %} tab-active{% endif %}" href="/devis/{{ id }}/encodage">Encodage</a>
  <a role="tab" class="tab{% if onglet == "totaux" %} tab-active{% endif %}" href="/devis/{{ id }}/totaux">Totaux</a>
  <a role="tab" class="tab{% if onglet == "visualisation" %} tab-active{% endif %}" href="/devis/{{ id }}/apercu">Visualisation</a>
</div>
